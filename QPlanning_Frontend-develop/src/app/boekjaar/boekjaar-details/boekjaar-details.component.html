<h2 mat-dialog-title>{{title}}</h2>

<mat-dialog-content class="grid" [formGroup]="form">


<table class="example-full-width">
  <tr>
    <!--Added character restriction and an error message-->
    <td>
      <mat-form-field class="example-full-width">
        <input matInput placeholder="Boekjaar" minlength="4" maxlength="4" #boekjaar formControlName="boekjaar" pattern="^[0-9]*$">
        <mat-hint align="end">{{boekjaar.value.length}} / 4</mat-hint>
        <mat-error *ngIf="form.get('boekjaar')?.hasError('required') && form.get('boekjaar')?.touched">
            Voer een geldig jaartal in
        </mat-error>
      </mat-form-field>
    </td>

    <!--Added character restriction and an error message-->
    <td>
      <mat-form-field class="example-full-width">
        <input matInput placeholder="Bedrag (in hele euro)" required maxlength="8" formControlName="bedrag" pattern="^[0-9]*$">
          <mat-error *ngIf="form.get('bedrag')?.hasError('required') && form.get('bedrag')?.touched">
            Voer een geldig getal in
          </mat-error>
      </mat-form-field>
    </td>
  </tr>
</table>

</mat-dialog-content>

  <mat-dialog-actions>
    <button class="mat-raised-button" (click)="close()">Sluiten</button>
    <button [disabled]="!form.valid" class="mat-raised-button mat-primary" (click)="save()">{{saveButtonText}}</button>
  </mat-dialog-actions>
